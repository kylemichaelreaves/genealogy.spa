name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter — that would restrict runs to PRs targeting main, so in
  # a stack only the bottom PR gets checked and every one above it merges on
  # faith. Any open PR should be gated, whatever it targets.
  pull_request:

# Supersede in-flight runs for the same ref so rapid pushes don't queue behind
# results nobody will read. `main` is excluded — those runs gate the deployable
# history and must each complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every action is pinned to a full commit SHA (tag in the trailing comment), and
# installs skip dependency lifecycle scripts: a moved tag or a compromised
# package cannot run code in CI. Neither project needs install scripts — native
# binaries arrive as platform packages, and Playwright's browsers are in the image.
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --ignore-scripts
      # Builds every project in tsconfig.json's `references`: app, node configs,
      # unit tests, and e2e. Vitest does not typecheck, so without this job a
      # type error reaches main and only surfaces as an opaque `vite build`
      # failure inside the Playwright webServer startup.
      - run: bun run typecheck

  unit-tests:
    name: Unit Tests
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test

  # SonarCloud analysis. Runs from CI rather than as SonarCloud's "Automatic Analysis" so
  # the vitest coverage report is included — Automatic Analysis inspects the repository
  # directly and never sees CI output. The two modes are mutually exclusive: Automatic
  # Analysis must be OFF in the SonarCloud project settings.
  #
  # Runs the suite with coverage itself, because the lcov report has to exist on the same
  # filesystem as the scanner.
  #
  # Skips itself (green, with a notice) until the SONAR_TOKEN secret exists, so CI is
  # usable before the SonarCloud project is set up. A job-level `if:` cannot read
  # secrets, hence the per-step check on the job env.
  sonarqube:
    name: SonarQube
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice title=SonarQube skipped::Add a SONAR_TOKEN repository secret to enable analysis."
      - if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Sonar attributes issues and decides what is new code from history; a shallow
          # clone makes every line look new.
          fetch-depth: 0
      - if: ${{ env.SONAR_TOKEN != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - if: ${{ env.SONAR_TOKEN != '' }}
        run: bun install --frozen-lockfile --ignore-scripts
      - if: ${{ env.SONAR_TOKEN != '' }}
        run: bun run test:coverage
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  e2e-tests:
    name: E2E Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run in the official Playwright image: browsers + system deps are baked in, so
    # there's no runtime `playwright install` (its browser download reliably hung on
    # hosted runners). The image tag MUST match the `playwright` version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The Playwright image is minimal and lacks `unzip`, which setup-bun needs to
      # extract the Bun release archive.
      - run: apt-get update && apt-get install -y unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --ignore-scripts
      # The county-history test fetches TopoJSON from the public S3 bucket, so this
      # job needs outbound network (hosted runners have it).
      - run: bun run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Publishes main to https://demos.kylereaves.com/genealogy/. The bucket,
  # distribution and this repo's deploy role live in kylereaves.infrastructure
  # (environments/demos-prod); the role can only write under genealogy/. Their
  # IDs are variables on the GitHub environment "demos", whose name is also what
  # the role's OIDC trust is scoped to.
  deploy:
    name: Deploy demo
    needs: [unit-tests, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: demos
      url: https://demos.kylereaves.com/genealogy/
    permissions:
      contents: read
      id-token: write
    # Never cancel a deploy halfway through its uploads.
    concurrency:
      group: deploy-demos-genealogy
      cancel-in-progress: false
    env:
      DEST: s3://${{ vars.S3_BUCKET }}/genealogy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:demo
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # Order matters: new hashed assets go up before the index.html that
      # references them, and the old ones are deleted only after it is live, so
      # a visitor mid-deploy never gets an index pointing at missing files.
      # Hashed assets are immutable; everything else is short-lived.
      - name: Upload to S3
        run: |
          aws s3 sync dist/assets "$DEST/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "$DEST" --delete --exclude "assets/*" --exclude index.html --cache-control "public, max-age=3600"
          aws s3 cp dist/index.html "$DEST/index.html" --cache-control "public, max-age=0, must-revalidate"
          aws s3 sync dist/assets "$DEST/assets" --delete --cache-control "public, max-age=31536000, immutable"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/genealogy/*"
